# Personal fork build: arm64-v8a release APK with Shizuku/ADB privileged support.
# Trigger manually from the Actions tab (workflow_dispatch).
name: Build APK (arm64)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (JDK 17, Flutter 3.47.7, Android SDK/NDK)
        run: |
          sudo mkdir -p /mnt/toolchain
          sudo chown -R "$(id -un):$(id -gn)" /mnt/toolchain
          bash tooling/setup-toolchain.sh
        env:
          DEV_ROOT: /mnt/toolchain

      - name: Build bundled Linux runtime (arm64-v8a)
        run: |
          source tooling/env.sh
          export GRADLE_USER_HOME=/mnt/toolchain/gradle
          export PUB_CACHE=/mnt/toolchain/pub-cache
          bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK (arm64, release)
        run: |
          source tooling/env.sh
          export GRADLE_USER_HOME=/mnt/toolchain/gradle
          export PUB_CACHE=/mnt/toolchain/pub-cache
          echo "ANDROID_HOME=$ANDROID_HOME"
          (yes | sdkmanager --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358") > /tmp/ndk-install.log 2>&1 || { tail -60 /tmp/ndk-install.log; exit 1; }
          tail -5 /tmp/ndk-install.log
          ls -la "$ANDROID_HOME/ndk" || exit 1
          # GitHub-hosted runners pre-export ANDROID_NDK_HOME / ANDROID_NDK_ROOT
          # pointing at their bundled NDK. tooling/env.sh only overrides
          # ANDROID_HOME, so tawcroot/build.py (which prefers ANDROID_NDK_HOME)
          # was reading the runner's NDK and failing its pinned-version check.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          cat "$ANDROID_NDK_HOME/source.properties" || exit 1
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-release-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
